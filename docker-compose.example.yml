services:
  # Reverse Proxy (Traefik example - Caddy, Nginx or Cloudflare also supported)
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-acme:/letsencrypt
    networks:
      - proxy-net

  # AdGuard Portal (Go + SQLite + React embedded)
  portal:
    build: .
    container_name: adguard-portal
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_PATH=/app/data/portal.db
      - DOH_DOMAIN=dns.example.com
      - AGH_URL=http://adguardhome:3000
      - AGH_USER=admin
      - AGH_PASSWORD=adguard_password
      - OIDC_ISSUER=https://auth.example.com
      - OIDC_CLIENT_ID=your_oidc_client_id
      - OIDC_PROVIDER_NAME=Single Sign-On
      - MAX_DEVICES_PER_USER=10
    volumes:
      - ./data/portal:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`portal.example.com`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls.certresolver=letsencrypt"
      - "traefik.http.services.portal.loadbalancer.server.port=8080"
    networks:
      - proxy-net
      - internal-net

  # AdGuard Home
  adguardhome:
    image: adguard/adguardhome:v0.107.56
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - ./data/agh/work:/opt/adguardhome/work
      - ./data/agh/conf:/opt/adguardhome/conf
    labels:
      - "traefik.enable=true"
      # Expose DoH endpoints through dns.example.com
      - "traefik.http.routers.agh-doh.rule=Host(`dns.example.com`) && PathPrefix(`/dns-query`)"
      - "traefik.http.routers.agh-doh.entrypoints=websecure"
      - "traefik.http.routers.agh-doh.tls.certresolver=letsencrypt"
      - "traefik.http.services.agh-doh.loadbalancer.server.port=3000"
    networks:
      - proxy-net
      - internal-net

networks:
  proxy-net:
    name: proxy-net
  internal-net:
    name: internal-net
